[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probeshift"
version = "0.1.0"
description = "Measure how little must change before your classifier flips: deterministic per-transform flip distances on benign transforms, from any predict function."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Habib Ur Rehman" },
]
keywords = [
    "robustness-measurement",
    "flip-distance",
    "counterfactual-probes",
    "model-evaluation",
    "common-corruptions",
    "fragility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/habib-analyst/probeshift"
Issues = "https://github.com/habib-analyst/probeshift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
